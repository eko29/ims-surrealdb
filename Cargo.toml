[package]
name = "ims"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio ={ version = "1.44.1", features = ["full"]}
surrealdb = { version = "2.2.1", features = ["kv-mem", "protocol-ws"] }
actix-cors = "0.7.1"
actix-web = "4.10.2"
chrono = { version = "0.4.40", features = ["serde"] }
dotenv = "0.15.0"
reqwest = {version = "0.12.15", features = ["cookies", "json", "stream"]}
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
actix-service = "2.0.3"
actix-web-httpauth = "0.8.2"
jsonwebtoken = "9.3.0"
frank_jwt = "3.1.3"
bcrypt = "0.17.0"
serde_derive = "1.0"
futures-util = "0.3.31"
anyhow = "1.0.97"
log = "0.4.27"
env_logger = "0.11.8"
uuid = "1.16.0"
lettre = "0.11.15"
rand = { version = "0.8.5", features = ["std"] }
chrono-tz = "0.10.3"
umya-spreadsheet = "2.2.3"
calamine = "0.22"
csv = "1.3.1"
actix-multipart = "0.7.2"
